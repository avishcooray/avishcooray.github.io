<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Avish Cooray</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0c0f'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='system-ui,sans-serif' font-size='18' font-weight='700' fill='%234f9cf9'%3EA%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0b0c0f;
      --border: #1f2330;
      --text: #d4d8e8;
      --text-muted: #6b7591;
      --accent: #4f9cf9;
      --mono: 'DM Mono', ui-monospace, monospace;
      --display: 'Syne', system-ui, sans-serif;
      --body: 'DM Sans', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    main {
      max-width: 420px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 48px 32px;
      background: #111318;
    }

    .code {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
    }

    h1 {
      font-family: var(--display);
      font-size: 28px;
      font-weight: 800;
      color: #eef0f8;
      margin-bottom: 12px;
    }

    p {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    a {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.06em;
      color: var(--accent);
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <a href="/">← Back to portfolio</a>
  </main>
</body>
</html>
